name: Versioning Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-version-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply versions from changesets
        run: pnpm version:packages

      - name: Sync Android Gradle version
        run: pnpm version:android:sync

      - name: Create version candidate patch
        run: git diff --binary > release-candidate.patch

      - name: Upload version candidate patch
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-patch
          path: release-candidate.patch

  validate-web-api:
    needs: prepare-version-candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download version candidate patch
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-patch

      - name: Apply version candidate patch
        run: git apply --binary release-candidate.patch

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web and API quality and unit tests
        run: pnpm quality

      - name: Build Web and API
        run: pnpm -r build

  validate-e2e:
    needs: prepare-version-candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopping_list_test
          POSTGRES_USER: testdb
          POSTGRES_PASSWORD: testdb
        options: >-
          --health-cmd "pg_isready -U testdb -d shopping_list_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_PROVIDER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: shopping_list_test
      DB_USER: testdb
      DB_PASSWORD: testdb
      DB_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download version candidate patch
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-patch

      - name: Apply version candidate patch
        run: git apply --binary release-candidate.patch

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test database and run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  validate-android:
    needs: prepare-version-candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Download version candidate patch
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-patch

      - name: Apply version candidate patch
        run: git apply --binary release-candidate.patch

      - name: Run Android unit tests
        run: pnpm test:android

  version-and-tag:
    needs: [validate-web-api, validate-e2e, validate-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download version candidate patch
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-patch

      - name: Apply version candidate patch
        run: git apply --binary release-candidate.patch

      - name: Commit version files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore(release): apply semantic version bumps"
            git push
          else
            echo "No version changes to commit"
          fi

      - name: Create app tags
        run: pnpm release:tag

      - name: Push tags
        run: git push --tags

      - name: Create GitHub releases for Web/API/Android
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const { execSync } = require('node:child_process')

            const readVersion = (file) => JSON.parse(fs.readFileSync(file, 'utf8')).version

            const APP_PATHS = {
              web: 'apps/web',
              api: 'apps/api',
              android: 'apps/mobile-android',
            }

            const run = (command) =>
              execSync(command, { encoding: 'utf8' }).trim()

            const tagExists = (tag) => {
              try {
                run(`git rev-parse -q --verify refs/tags/${tag}`)
                return true
              } catch {
                return false
              }
            }

            const getPreviousTag = (app, currentTag) => {
              const tags = run(`git tag --list '${app}-v*' --sort=-v:refname`)
                .split('\n')
                .map((tag) => tag.trim())
                .filter(Boolean)

              return tags.find((tag) => tag !== currentTag) || null
            }

            const getKeyChanges = (app, previousTag, currentTag) => {
              const appPath = APP_PATHS[app]
              const range = previousTag ? `${previousTag}..${currentTag}` : currentTag
              const command = previousTag
                ? `git log --pretty=format:%s ${range} -- '${appPath}'`
                : `git log --pretty=format:%s -n 20 ${range} -- '${appPath}'`

              let rawMessages = ''

              try {
                rawMessages = run(command)
              } catch {
                return []
              }

              if (!rawMessages) return []

              return [...new Set(
                rawMessages
                  .split('\n')
                  .map((message) => message.trim())
                  .filter((message) => message && !message.startsWith('chore(release): apply semantic version bumps'))
              )].slice(0, 8)
            }

            const buildReleaseBody = ({ app, version, tag, previousTag, keyChanges }) => {
              const appLabel = app.toUpperCase()
              const previousTagLabel = previousTag ? `\`${previousTag}\`` : 'Initial release for this app tag stream'
              const keyChangesSection = keyChanges.length
                ? keyChanges.map((change) => `- ${change}`).join('\n')
                : '- No app-scoped commit messages found in this version window.'

              return [
                `## What's Included`,
                `- App: ${appLabel}`,
                `- Version: \`${version}\``,
                `- Tag: \`${tag}\``,
                `- Based on: ${previousTagLabel}`,
                '',
                '## Key Changes',
                keyChangesSection,
                '',
                '## Impact & Notes',
                '- Generated automatically from git history (deterministic, no AI summarization).',
                '- Release flow, versioning, and tag strategy remain unchanged.',
                '- If key changes are empty, review merged commits for non app-scoped updates.',
              ].join('\n')
            }

            const releases = [
              { app: 'web', version: readVersion('apps/web/package.json'), makeLatest: 'false' },
              { app: 'api', version: readVersion('apps/api/package.json'), makeLatest: 'false' },
              { app: 'android', version: readVersion('apps/mobile-android/package.json'), makeLatest: 'true' },
            ]

            for (const { app, version, makeLatest } of releases) {
              const tag = `${app}-v${version}`

              if (!tagExists(tag)) {
                core.info(`Tag ${tag} not found. Skipping release creation for ${app}.`)
                continue
              }

              const previousTag = getPreviousTag(app, tag)
              const keyChanges = getKeyChanges(app, previousTag, tag)
              const body = buildReleaseBody({ app, version, tag, previousTag, keyChanges })

              try {
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                })
                core.info(`Release already exists for ${tag}`)
                continue
              } catch (error) {
                if (error.status !== 404) throw error
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `${app.toUpperCase()} Release v${version}`,
                body,
                make_latest: makeLatest,
              })

              core.info(`Created release for ${tag}`)
            }

      - name: Android release reminder
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile-android/package.json').version)")
          echo "📱 Android $VERSION versioned. Reminder: build/sign/upload APK/AAB manually."
