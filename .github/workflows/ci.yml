name: Technical CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-api:
    name: Web and API quality, tests, and builds
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web and API quality and unit tests
        run: pnpm quality

      - name: Build Web and API
        run: pnpm -r build

  e2e:
    name: End-to-end tests
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopping_list_test
          POSTGRES_USER: testdb
          POSTGRES_PASSWORD: testdb
        options: >-
          --health-cmd "pg_isready -U testdb -d shopping_list_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_PROVIDER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: shopping_list_test
      DB_USER: testdb
      DB_PASSWORD: testdb
      DB_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test database and run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  android:
    name: Android unit tests
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests
        run: pnpm test:android
